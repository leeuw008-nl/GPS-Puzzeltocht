<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769aa">
<link rel="manifest" href="manifest.json">
<title>GPS Puzzeltocht</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#173042;background:#f4f7f9}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{display:flex;justify-content:center}
.app{width:100%;max-width:620px;height:100svh;padding:10px 12px;display:flex;flex-direction:column;gap:7px}
h1{font-size:1.25rem;margin:0}.header{display:flex;align-items:center;justify-content:space-between}.menuBtn{background:transparent;color:#173042;font-size:1.45rem;padding:2px 6px;line-height:1}.menu{position:absolute;right:12px;top:48px;z-index:20;width:min(92vw,400px);max-height:70svh;overflow:auto}.menuItem{display:grid;grid-template-columns:1fr auto auto;gap:5px;align-items:center;padding:7px 0;border-bottom:1px solid #e5eaed}.menuItem:last-child{border-bottom:0}
.card{background:#fff;border-radius:14px;padding:10px;box-shadow:0 2px 10px #0001}
button{border:0;border-radius:9px;padding:9px 10px;font-size:.9rem;font-weight:650;background:#1769aa;color:#fff}button.active{background:#238636}button.secondary{background:#e8eef2;color:#173042}button:disabled{opacity:.42}
input,select,textarea{font:inherit;border:1px solid #ccd7dd;border-radius:8px;padding:8px;background:#fff}textarea{width:100%;resize:none}input[type=range]{width:100%;padding:0}
.topline{display:flex;gap:7px;align-items:center}.topline input{flex:1;min-width:0}.topline button{white-space:nowrap}
.slots{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:7px 0}.slot{padding:7px 2px;font-size:.78rem;background:#e8eef2;color:#173042}.slot.selected{background:#1769aa;color:#fff}.slot.done{font-weight:800}
.editor{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center}.editor .wide{grid-column:1/-1}
.compact{font-size:.78rem;color:#60727e}.coord{font-size:.8rem;font-weight:650}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.actions button{width:100%}
.routes{display:grid;grid-template-columns:1fr auto;gap:6px}.routes select{min-width:0;width:100%}
.status{padding:7px 9px;border-radius:8px;background:#eef5f8;font-size:.8rem}.ok{background:#eaf7ee}.warn{background:#fff5df}
.test{display:flex;flex-direction:column;min-height:0;flex:1}.distance{display:grid;grid-template-columns:1fr 1fr;gap:6px}.big{font-size:2rem;font-weight:750;text-align:center}.muted{text-align:center;color:#657782;font-size:.75rem}.arrow{font-size:4.3rem;line-height:.9;text-align:center;transition:transform .25s}
.testmain{display:grid;grid-template-columns:1fr 1fr;gap:7px}.testmain .wide{grid-column:1/-1}
.puzzle{margin-top:7px}.puzzle input{width:100%}.hidden{display:none!important}
.footer{font-size:.68rem;color:#71818a;text-align:center}
@media(max-height:700px){.app{padding-top:6px;gap:5px}.card{padding:8px}.slots{margin:4px 0}.slot{padding:5px 1px}.editor{gap:5px}.big{font-size:1.7rem}.arrow{font-size:3.2rem}}
</style>
</head>
<body>
<div class="app">
<div class="header"><h1>GPS Puzzeltocht</h1><button id="menuButton" class="menuBtn" aria-label="Menu">☰</button></div>
<div id="menu" class="card menu hidden">
 <strong>Opgeslagen routes</strong>
 <div id="menuRoutes"></div>
</div>

<section id="setup" class="card">
 <div class="topline">
  <input id="routeName" placeholder="Naam van de route">
  <button id="saveRoute">Opslaan</button>
 </div>
 <div class="slots" id="slots"></div>
 <div class="editor">
  <strong id="selectedTitle">Locatie 1</strong>
  <span class="coord" id="selectedCoord">nog niet ingesteld</span>
  <button id="setLocation" class="wide">📍 Stel deze locatie in op huidige positie</button>
  <label class="wide">Aankomstradius: <strong id="radiusValue">15</strong> m
   <input id="radius" type="range" min="5" max="50" value="15" step="5">
  </label>
  <label class="wide">Vraag voor deze locatie
   <textarea id="question" rows="2" placeholder="Omschrijf hier de vraag of opdracht"></textarea>
  </label>
  <div id="setupStatus" class="status wide">Kies een locatie en stel die in op je huidige GPS-positie.</div>
 </div>
 <div class="actions" style="margin-top:7px">
  <button id="testCurrent">Test huidige route</button>
  <button id="newRoute" class="secondary">Nieuwe route</button>
 </div>
 <div class="routes" style="margin-top:7px">
  <select id="savedRoutes"><option value="">Opgeslagen routes…</option></select>
  <button id="testSaved">Test</button>
 </div>
</section>

<section id="test" class="test hidden">
 <div class="card">
  <div class="topline"><strong id="testRouteName">Route</strong><button id="backSetup" class="secondary">← Bewerken</button></div>
  <div class="status" id="testStatus">GPS-positie wordt gezocht…</div>
 </div>
 <div class="card distance">
  <div><div class="big" id="distance">—</div><div class="muted">afstand tot doel</div></div>
  <div><div class="arrow" id="arrow">↑</div><div class="muted" id="direction">kompas nog niet beschikbaar</div></div>
 </div>
 <div class="card testmain">
  <div><strong>Stap</strong><strong id="step" style="text-align:right">—</strong>
  </div>
  <div class="wide">
   <h2 id="clueTitle" style="font-size:1rem;margin:4px 0">—</h2>
   <div class="compact" id="clue">—</div>
  </div>
  <div class="wide" id="puzzle" class="puzzle">
   <div class="status ok">🎉 Locatie gevonden!</div>
   <div class="compact" id="puzzleQuestion" style="margin:5px 0">Beantwoord de opdracht.</div>
   <input id="answer" placeholder="Jouw antwoord" autocomplete="off">
   <button id="checkAnswer" style="width:100%;margin-top:5px">Controleer antwoord</button>
   <div class="status hidden" id="answerStatus"></div>
  </div>
 </div>
 <div class="footer">GPS-nauwkeurigheid: <span id="accuracy">—</span> m · Doel: <span id="target">—</span></div>
</section>
</div>
<script>
const $=id=>document.getElementById(id);
let current=null,deviceHeading=null,orientationStarted=false,usingAbsolute=false;
let selected=0,setupLocations=[],setupQuestions=[],routes=[],testRoute=null,testIndex=0,target=null,reached=false;

function load(){
 try{setupLocations=JSON.parse(localStorage.getItem('gpsPuzzleLocations')||'[]')}catch{setupLocations=[]}
 try{routes=JSON.parse(localStorage.getItem('gpsPuzzleRoutes')||'[]')}catch{routes=[]}
 try{setupQuestions=JSON.parse(localStorage.getItem('gpsPuzzleQuestions')||'[]')}catch{setupQuestions=[]}
 setupQuestions=Array.from({length:10},(_,i)=>String(setupQuestions[i]||''));
 setupLocations=Array.from({length:10},(_,i)=>{
  const x=setupLocations[i];
  if(!x)return null;
  return x.lat!==undefined?{lat:x.lat,lon:x.lon,radius:Number(x.radius)||15}:null;
 });
 renderRoutes();renderSlots();selectLocation(0);
}
function saveSetup(){localStorage.setItem('gpsPuzzleLocations',JSON.stringify(setupLocations));localStorage.setItem('gpsPuzzleQuestions',JSON.stringify(setupQuestions))}
function renderSlots(){
 $('slots').innerHTML='';
 setupLocations.forEach((x,i)=>{
  const b=document.createElement('button');b.className='slot'+(i===selected?' selected':'')+(x?' done':'');
  b.textContent=x?'✓'+(i+1):(i+1);b.onclick=()=>selectLocation(i);$('slots').appendChild(b);
 });
}
function selectLocation(i){
 selected=i;const x=setupLocations[i];
 $('selectedTitle').textContent='Locatie '+(i+1);
 $('selectedCoord').textContent=x?fmtCoord(x):'nog niet ingesteld';
 $('radius').value=x?.radius||15;$('radiusValue').textContent=x?.radius||15;
 $('question').value=setupQuestions[i]||'';
 $('setupStatus').textContent=x?'✓ Locatie '+(i+1)+' ingesteld. Pas evt. aankomstradius aan.':'Kies deze locatie en druk op “Stel deze locatie in”.';
 renderSlots();
}
$('radius').oninput=()=>{const v=Number($('radius').value);$('radiusValue').textContent=v;if(setupLocations[selected]){setupLocations[selected].radius=v;saveSetup()}};
$('question').oninput=()=>{setupQuestions[selected]=$('question').value;saveSetup()};
function setLocation(){
 if(!current){$('setupStatus').textContent='Wacht eerst tot GPS een positie heeft gevonden.';return}
 const radius=Number($('radius').value)||15;
 setupLocations[selected]={lat:current.lat,lon:current.lon,radius};
 saveSetup();selectLocation(selected);
 $('setupStatus').textContent='✓ Locatie '+(selected+1)+' opgeslagen op '+fmtCoord(current)+' met '+radius+' m radius.';
}
$('setLocation').onclick=setLocation;

function routeReady(){return setupLocations.some(Boolean)}
function makeRoute(name){
 const stages=setupLocations.filter(Boolean).map((x,i)=>({
  title:'Locatie '+(i+1),clue:i===0?'Volg de pijl naar locatie 1.':'Goed gedaan. Ga nu naar locatie '+(i+1)+'.',
  target:{lat:x.lat,lon:x.lon},radius:x.radius,question:setupQuestions[i]?.trim()||'Testvraag bij locatie '+(i+1)+'.',answer:String(i+1)
 }));
 return{name:name.trim()||'Nieuwe route',stages,created:new Date().toISOString()};
}
function saveRoute(){
 if(!routeReady()){ $('setupStatus').textContent='Stel eerst minimaal één locatie in.';return}
 const r=makeRoute($('routeName').value);
 const existing=routes.findIndex(x=>x.name===r.name);
 if(existing>=0)routes[existing]=r;else routes.push(r);
 localStorage.setItem('gpsPuzzleRoutes',JSON.stringify(routes));renderRoutes();
 $('routeName').value=r.name;$('setupStatus').textContent='✓ Route “'+r.name+'” opgeslagen met '+r.stages.length+' locaties.';
}
$('saveRoute').onclick=saveRoute;
$('menuButton').onclick=()=>{$('menu').classList.toggle('hidden')};
document.addEventListener('click',e=>{if(!$('menu').contains(e.target)&&e.target!==$('menuButton'))$('menu').classList.add('hidden')});
function renderRoutes(){
 const s=$('savedRoutes');s.innerHTML='<option value="">Opgeslagen routes…</option>';
 routes.forEach((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=r.name+' ('+r.stages.length+')';s.appendChild(o)});
 renderMenuRoutes();
}
function renderMenuRoutes(){
 const box=$('menuRoutes');box.innerHTML='';
 if(!routes.length){box.innerHTML='<div class="compact" style="padding-top:7px">Nog geen opgeslagen routes.</div>';return}
 routes.forEach((r,i)=>{
  const row=document.createElement('div');row.className='menuItem';
  const name=document.createElement('strong');name.textContent=r.name+' ('+r.stages.length+')';
  const edit=document.createElement('button');edit.textContent='Bewerken';edit.className='secondary';edit.onclick=()=>editRoute(i);
  const del=document.createElement('button');del.textContent='Verwijder';del.className='secondary';del.onclick=()=>deleteRoute(i);
  row.append(name,edit,del);box.appendChild(row);
 });
}
function editRoute(i){
 const r=routes[i];if(!r)return;
 setupLocations=Array.from({length:10},(_,n)=>r.stages[n]?{...r.stages[n].target,radius:r.stages[n].radius||15}:null);
 setupQuestions=Array.from({length:10},(_,n)=>r.stages[n]?.question||'');
 saveSetup();$('routeName').value=r.name;selectLocation(0);$('savedRoutes').value=String(i);$('menu').classList.add('hidden');
}
function deleteRoute(i){
 const r=routes[i];if(!r)return;
 if(!confirm('Route “'+r.name+'” verwijderen?'))return;
 routes.splice(i,1);localStorage.setItem('gpsPuzzleRoutes',JSON.stringify(routes));renderRoutes();
 $('savedRoutes').value='';$('menu').classList.add('hidden');
 $('setupStatus').textContent='Route verwijderd.';
}
$('savedRoutes').onchange=()=>{
 const r=routes[Number($('savedRoutes').value)];if(!r)return;
 setupLocations=Array.from({length:10},(_,i)=>r.stages[i]?{...r.stages[i].target,radius:r.stages[i].radius||15}:null);
 setupQuestions=Array.from({length:10},(_,i)=>r.stages[i]?.question||'');
 saveSetup();$('routeName').value=r.name;selectLocation(0);
};
$('testSaved').onclick=()=>{
 const r=routes[Number($('savedRoutes').value)];
 if(!r){$('setupStatus').textContent='Kies eerst een opgeslagen route.';return}
 startTest(r);
};
$('testCurrent').onclick=()=>{
 if(!routeReady()){$('setupStatus').textContent='Stel eerst minimaal één locatie in.';return}
 startTest(makeRoute($('routeName').value));
};
$('newRoute').onclick=()=>{
 testRoute=null;testIndex=0;setupLocations=[];setupQuestions=Array(10).fill('');$('routeName').value='';saveSetup();selectLocation(0);
};
function startTest(r){
 testRoute=r;testIndex=0;reached=false;target=r.stages[0].target;
 $('setup').classList.add('hidden');$('test').classList.remove('hidden');$('testRouteName').textContent=r.name;
 setStage();update();
}
$('backSetup').onclick=()=>{$('test').classList.add('hidden');$('setup').classList.remove('hidden');testRoute=null};

function rad(x){return x*Math.PI/180}function deg(x){return x*180/Math.PI}function norm(x){return(x%360+360)%360}
function distance(a,b){const R=6371000,p1=rad(a.lat),p2=rad(b.lat),dp=rad(b.lat-a.lat),dl=rad(b.lon-a.lon),h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function bearing(a,b){const p1=rad(a.lat),p2=rad(b.lat),dl=rad(b.lon-a.lon),y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);return norm(deg(Math.atan2(y,x)))}
function fmtCoord(p){return p?p.lat.toFixed(5)+', '+p.lon.toFixed(5):'—'}
function smoothHeading(next){if(deviceHeading===null){deviceHeading=next;return}const d=(next-deviceHeading+540)%360-180;deviceHeading=norm(deviceHeading+d*.25)}
function handleAbsolute(e){if(typeof e.alpha!=='number'||!isFinite(e.alpha))return;let h=norm(360-e.alpha),a=screen.orientation?.angle||0;h=norm(h+a);smoothHeading(h);usingAbsolute=true;orientationStarted=true;update()}
function handleFallback(e){if(usingAbsolute)return;if(typeof e.webkitCompassHeading==='number'&&isFinite(e.webkitCompassHeading)){smoothHeading(e.webkitCompassHeading);orientationStarted=true;update()}}
function startOrientation(){if(orientationStarted)return;window.addEventListener('deviceorientationabsolute',handleAbsolute,true);window.addEventListener('deviceorientation',handleFallback,true);if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')DeviceOrientationEvent.requestPermission(true).catch(()=>{})}
function setStage(){const s=testRoute?.stages[testIndex];if(!s)return;target=s.target;reached=false;$('puzzle').classList.add('hidden');$('answer').value='';$('answerStatus').className='status hidden';$('step').textContent=(testIndex+1)+' / '+testRoute.stages.length;$('clueTitle').textContent=s.title;$('clue').textContent=s.clue}
function update(){
 if(!current)return;
 $('accuracy').textContent=Math.round(current.accuracy);$('target').textContent=fmtCoord(target);
 if(!testRoute||!target){$('distance').textContent='—';return}
 const s=testRoute.stages[testIndex],d=distance(current,target),b=bearing(current,target);
 $('distance').textContent=d<1000?Math.round(d)+' m':(d/1000).toFixed(2)+' km';
 if(deviceHeading!==null){const rel=(b-deviceHeading+540)%360-180;$('arrow').style.transform='rotate('+rel+'deg)';$('direction').textContent=Math.round(b)+'°'}
 else{$('direction').textContent='kompas —'}
 $('testStatus').textContent=current.accuracy>30?'GPS minder nauwkeurig dan 30 m; wacht even.':('Stap '+(testIndex+1)+' van '+testRoute.stages.length+' • aankomstradius '+s.radius+' m');
 if(d<=s.radius){
  if(!reached){reached=true;$('puzzleQuestion').textContent=s.question;$('puzzle').classList.remove('hidden')}
  $('testStatus').className='status ok';$('testStatus').textContent='🎉 Locatie '+(testIndex+1)+' bereikt!';
 }else{
  reached=false;$('puzzle').classList.add('hidden');$('testStatus').className='status';$('testStatus').textContent='Stap '+(testIndex+1)+' van '+testRoute.stages.length+' • '+Math.round(d)+' m naar doel • radius '+s.radius+' m';
 }
}
function onPos(pos){current={lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy:pos.coords.accuracy};update()}
function onErr(e){$('testStatus').textContent='GPS-fout: '+e.message;$('testStatus').className='status warn'}
if('geolocation'in navigator)navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:2000,timeout:15000});
startOrientation();
$('checkAnswer').onclick=()=>{
 if(!testRoute||!reached)return;
 const s=testRoute.stages[testIndex],given=$('answer').value.trim().toUpperCase(),expected=s.answer.toUpperCase(),box=$('answerStatus');
 if(given!==expected){box.className='status warn';box.textContent='Nog niet goed. Probeer opnieuw.';return}
 if(testIndex<testRoute.stages.length-1){testIndex++;setStage();update()}
 else{$('testStatus').className='status ok';$('testStatus').textContent='🏁 Route voltooid!';$('clueTitle').textContent='Route voltooid';$('clue').textContent='Alle '+testRoute.stages.length+' locaties zijn afgerond.';$('puzzle').classList.add('hidden')}
};
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}))}
load();
</script>
</body>
</html>
